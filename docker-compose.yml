version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_maturity
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  service:
    build:
      context: ./service
    restart: unless-stopped
    env_file: ./service/.env
    expose:
      - "8000"
    volumes:
      - reports:/app/reports
    depends_on:
      db:
        condition: service_healthy

  bot:
    build:
      context: ./bot
    restart: unless-stopped
    env_file: ./bot/.env
    volumes:
      - ./service/data:/app/../service/data:ro
    depends_on:
      - service

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - service

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  pgdata:
  reports:
  certbot-conf:
  certbot-www:
